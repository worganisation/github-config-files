---
name: '"Semantic Release" Runner'

on:
  workflow_call:
    inputs:
      python-version:
        description: The Python version to release with
        required: true
        type: string
      force-deployment:
        description: >-
          Forces a release at a specific level ("patch", "minor", "major"),
          bypassing normal commit-based detection. Pass an empty string (the
          caller's own "auto" choice) for normal behaviour - workflow_call
          inputs can't be typed as a dropdown, so the choice UI lives in each
          calling workflow's own workflow_dispatch input.
        required: false
        type: string
    outputs:
      released:
        description: Whether a release was made
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: The tag of the release
        value: ${{ jobs.release.outputs.tag }}
      version:
        description: The version of the release
        value: ${{ jobs.release.outputs.version }}
    secrets:
      DEPLOY_KEY:
        description: SSH deploy key used to push release commits and tags
        required: true
      WORGARSIDE_DEV_TOKEN:
        description: GitHub token used by Python Semantic Release
        required: true

jobs:
  release:
    name: Release
    environment: production
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log Inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n$INPUTS\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # Run PSR directly instead of through its Docker action so we can pin its
      # GitPython dependency: https://github.com/python-semantic-release/python-semantic-release/issues/1476
      - name: Install Python Semantic Release
        run: |
          python -m pip install \
            "python-semantic-release==10.6.1" \
            "GitPython==3.1.59"

      - name: Python Semantic Release
        id: python-semantic-release
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          GIT_COMMIT_AUTHOR: "worgarside-dev <worgarside.dev@gmail.com>"
          FORCE_DEPLOYMENT: ${{ inputs.force-deployment }}
        run: |
          set -euo pipefail

          git config --global user.name "worgarside-dev"
          git config --global user.email "worgarside.dev@gmail.com"
          # Root git on a runner-owned checkout refuses with dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          release_key="${RUNNER_TEMP}/semantic-release-deploy-key"
          release_known_hosts="${RUNNER_TEMP}/semantic-release-known-hosts"
          install -m 600 /dev/null "${release_key}"
          printf '%s\n' "${DEPLOY_KEY}" > "${release_key}"
          gh api meta --jq '.ssh_keys[] | "ssh.github.com " + .' \
            > "${release_known_hosts}"

          ssh_command="ssh -i ${release_key}"
          ssh_command+=" -o IdentitiesOnly=yes"
          ssh_command+=" -o StrictHostKeyChecking=yes"
          ssh_command+=" -o UserKnownHostsFile=${release_known_hosts}"
          git config --local core.sshCommand "${ssh_command}"
          git remote set-url origin \
            "ssh://git@ssh.github.com:443/${GITHUB_REPOSITORY}.git"

          command=(semantic-release -v -v --config pyproject.toml version)

          case "${FORCE_DEPLOYMENT}" in
            "") ;;
            patch|minor|major) command+=("--${FORCE_DEPLOYMENT}") ;;
            *)
              echo "::error title=Invalid force deployment::" \
                "'${FORCE_DEPLOYMENT}' must be patch, minor, major, or empty."
              exit 1
              ;;
          esac

          runner_uid=$(id -u)
          runner_gid=$(id -g)
          cleanup() {
            rm -f "${release_key}" "${release_known_hosts}"
            sudo chown -R "${runner_uid}:${runner_gid}" "$GITHUB_WORKSPACE"
          }
          trap cleanup EXIT

          # Temporary workaround: run PSR as root so downstream build commands
          # that call apt-get continue to work. Revert with the return to the
          # pinned PSR Docker action once the linked GitPython issue is fixed.
          sudo -E env "PATH=$PATH" "${command[@]}"
