---
name: CodSpeed Benchmarks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run Benchmarks
    # {% if not token %}
    permissions:
      contents: read
      id-token: write
    # {% endif %}
    env:
      BENCHMARK_REPO: '{{ benchmark_repo }}'
      HA_BENCHMARK_REPO_PATH: '{% raw %}${{ github.workspace }}{% endraw %}/benchmark-input'
    runs-on: >-
      {% raw %}${{ fromJSON(format('{0}', '{% endraw %}{{ benchmark_runner }}{% raw %}')) }}{% endraw %}
    if: >-
      github.repository != 'worganisation/home-assistant-config-validator' &&
      !github.event.pull_request.draft
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get benchmark fixture release
        if: env.BENCHMARK_REPO != ''
        id: fixture-tag
        env:
          GH_TOKEN: '{% raw %}${{ secrets.WORGARSIDE_DEV_TOKEN }}{% endraw %}'
        run: |
          tag=$(gh release view --repo "$BENCHMARK_REPO" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout benchmark fixture
        if: env.BENCHMARK_REPO != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '{% raw %}${{ env.BENCHMARK_REPO }}{% endraw %}'
          ref: '{% raw %}${{ steps.fixture-tag.outputs.tag }}{% endraw %}'
          path: benchmark-input
          token: '{% raw %}${{ secrets.WORGARSIDE_DEV_TOKEN }}{% endraw %}'
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: "{% raw %}${{ runner.environment == 'github-hosted' }}{% endraw %}"
          cache-local-path: '{% raw %}${{ runner.tool_cache }}/uv-cache{% endraw %}'
          python-version: '{{ python_version }}'

      - name: Install Dependencies
        run: uv sync --locked --all-groups

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          token: '{{ token }}'
          run: uv run --no-sync pytest {{ pytest_args }} --codspeed -v -n 0
