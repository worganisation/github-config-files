---
name: CodSpeed Benchmarks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    if: >-
      !github.event.pull_request.draft
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: "{% raw %}${{ runner.environment == 'github-hosted' }}{% endraw %}"
          cache-local-path: '{% raw %}${{ runner.tool_cache }}/uv-cache{% endraw %}'
          python-version: '{{ python_version }}'

      - name: Install Dependencies
        run: uv sync --locked --all-groups

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          token: '{{ token }}'
          run: uv run --no-sync pytest {{ pytest_args }} --codspeed -v -n 0
