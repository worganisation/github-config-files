---
name: Integration Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  run-integration-test:
    name: Run Integration Test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - self-hosted
      - linux
      - x64
      - cc
      - iac
      - opentofu
    env:
      EXIT_1: '0'
      HA_REPO_PATH: ${{ github.workspace }}/home-assistant
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: home-assistant-config-validator
          ref: ${{ github.ref}}
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Get Latest HA Release
        id: ha-tag
        env:
          GH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
        # yamllint disable rule:line-length
        run: |
          tag=$(gh release view --repo worganisation/home-assistant --json tagName --jq '.tagName')

          echo "Running integration test against [`worganisation/home-assistant@${tag}`](https://github.com/worganisation/home-assistant/releases/tag/${tag})"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        # yamllint enable rule:line-length

      - name: Clone Home Assistant Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: home-assistant
          ref: ${{ steps.ha-tag.outputs.tag }}
          repository: worganisation/home-assistant
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-local-path: ${{ runner.tool_cache }}/uv-cache
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: home-assistant-config-validator
        run: uv sync --locked --no-dev

      - name: Generate README
        working-directory: home-assistant-config-validator
        run: uv run --no-sync python home_assistant_config_validator/readme_generator.py

      - name: Validate Entities
        working-directory: home-assistant-config-validator
        run: uv run --no-sync python home_assistant_config_validator/validate_entities.py

      - name: Validate Lovelace
        working-directory: home-assistant-config-validator
        continue-on-error: true
        run: uv run --no-sync python home_assistant_config_validator/validate_lovelace.py
