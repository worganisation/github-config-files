---
name: Manage Repo Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/repo_labels.yml
      - .github/workflows/manage-repo-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  manage-repo-labels:
    name: Manage Repo Labels
    runs-on: [self-hosted, linux, x64, cc, iac, opentofu]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add or update standard labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/repo_labels.yml
          # Preserve owner labels, including every DO NOT MERGE spelling.
          skip-delete: true
