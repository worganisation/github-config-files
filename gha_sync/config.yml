---
# yamllint disable rule:line-length

group:
  # All Repos
  # PR-hygiene workflows are synced as individual files with an explicit
  # per-entry deleteOrphaned: true, so removing one of these from GCF still
  # cascades a delete downstream. This is deliberately NOT a directory sync:
  # repos that have moved to the PSR-based pattern (semantic-release.yml,
  # prek-hooks.yml, prek-autoupdate.yml, unit-tests.yml, etc.) keep bespoke,
  # non-synced files in this same .github/workflows/ directory, and a
  # directory-level orphan-delete would wipe those out too.
  - files:
      - .github/actionlint.yaml
      - .github/CODEOWNERS
      - source: gha_sync/workflows/all/auto-create-pr.yml
        dest: .github/workflows/auto-create-pr.yml
        deleteOrphaned: true
      - source: gha_sync/workflows/all/manage-pr.yml
        dest: .github/workflows/manage-pr.yml
        deleteOrphaned: true
      - source: gha_sync/workflows/all/manage-repo-labels.yml
        dest: .github/workflows/manage-repo-labels.yml
        deleteOrphaned: true
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/gpu-worker
      worganisation/home-assistant
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player
      worganisation/wg-scripts
      worganisation/wg-utilities

  # Retired source: remove standalone callers as consolidated metadata is installed.
  - files:

      - source: gha_sync/workflows/all/set-pr-auto-merge.yml
        dest: .github/workflows/set-pr-auto-merge.yml
        deleteOrphaned: true
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/gpu-worker
      worganisation/home-assistant
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player
      worganisation/wg-scripts
      worganisation/wg-utilities

  # Renovate owns version updates; Dependabot retains security updates.
  - files:
      - .github/dependabot.yml
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/gpu-worker
      worganisation/home-assistant
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player
      worganisation/wg-scripts
      worganisation/wg-utilities

  # The personal template retains its independent Dependabot policy.
  - files:
      - source: gha_sync/configs/dependabot.yml
        dest: .github/dependabot.yml
    repos: |
      worgarside/python-template

  # Prek Auto-Update - identical for every repo on the prek/PSR pattern, no
  # per-repo variation, so this is a plain synced file rather than a
  # per-repo template entry.
  - files:
      - source: gha_sync/workflows/all/prek-autoupdate.yml
        dest: .github/workflows/prek-autoupdate.yml
        deleteOrphaned: true
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/frigate-config
      worganisation/gpu-worker
      worganisation/home-assistant
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worganisation/wg-scripts
      worganisation/wg-utilities

  # Release Drafter - only the repos still on the legacy label-based release
  # mechanism (__ci-validation.yml / __ci-deployment.yml) need this. Repos
  # migrated to python-semantic-release generate their own GitHub releases
  # directly and must NOT receive this file.
  - files:
      - source: gha_sync/configs/release-drafter.yml
        dest: .github/release-drafter.yml
    repos: |
      worgarside/python-template

  # No Custom Labels
  # The only exclusion is `home-assistant`, which has its own repo_labels.yml:
  # https://github.com/worganisation/home-assistant/blob/main/.github/repo_labels.yml
  - files:
      - .github/labeler.yml
      - .github/repo_labels.yml
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/gpu-worker
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player
      worganisation/wg-scripts
      worganisation/wg-utilities

  # Standard .yamllint
  - files:
      - .yamllint
    repos: |
      worganisation/backplane
      worganisation/esphome
      worganisation/gpu-worker
      worganisation/home-assistant-appdaemon
      worganisation/home-assistant-config-validator
      worganisation/led-matrix-controller
      worganisation/pre-commit-hooks-dependency-sync
      worgarside/python-template
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player
      worganisation/wg-scripts

  # Standard CI Validation with version bump in pyproject.toml
  # Only for repos still on the legacy label-based release mechanism - repos
  # migrated to python-semantic-release have their own bespoke
  # unit-tests.yml/semantic-release.yml and must NOT receive this.
  - files:
      - source: gha_sync/workflows/template/ci_validation.template.yml
        dest: .github/workflows/ci_validation.yml
        template:
          build_branch: ${{ github.ref }}
          python_version: '3.12'
    repos: |
      worgarside/python-template
      worganisation/smart-mini-crt-interface
      worganisation/very-slow-movie-player

  # Standard CI Deployment with version bump in pyproject.toml
  # Same caveat as Standard CI Validation above.
  - files:
      - source: gha_sync/workflows/template/ci_deployment.template.yml
        dest: .github/workflows/ci_deployment.yml
        template:
          build_branch: ${{ github.ref }}
          python_version: '3.12'
          release_tag: ${{ needs.ci-validation.outputs.release-tag }}
          update_pyproject_toml: 'true'
    repos: |
      worgarside/python-template

worganisation/esphome:
  # Hooks need no Python project environment; published releases propose submodule updates.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: ''
      sync_project_dependencies: 'false'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/backplane:
  # Keep the prerelease-capable caller managed; deployment remains Backplane-owned.
  - source: gha_sync/workflows/repo/backplane/semantic-release.yml
    dest: .github/workflows/semantic-release.yml
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.14'
      sync_project_dependencies: 'true'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.14'
      source_dir: src

worganisation/frigate-config:
  - source: gha_sync/workflows/all/auto-create-pr.yml
    dest: .github/workflows/auto-create-pr.yml
    deleteOrphaned: true
  # Frigate's hooks do not require a Python project environment; the shared
  # workflow still installs and runs each hook's own isolated dependencies.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: ''
      sync_project_dependencies: 'false'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.11'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/gpu-worker:
  # Host-specific workflows remain bespoke, but
  # the repository still uses the shared hook runner and managed baseline.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.14'
      sync_project_dependencies: 'false'

worganisation/infrastructure:
  - source: gha_sync/workflows/all/auto-create-pr.yml
    dest: .github/workflows/auto-create-pr.yml
    deleteOrphaned: true

worganisation/home-assistant:
  # HA maintains its manual release caller beside its configuration workflows.
  - source: gha_sync/workflows/repo/home-assistant/
    dest: .github/workflows/
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
      sync_project_dependencies: 'true'

worganisation/home-assistant-appdaemon:
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
      sync_project_dependencies: 'true'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/home-assistant-config-validator:
  - source: gha_sync/workflows/repo/home-assistant-config-validator/
    dest: .github/workflows/
  - source: gha_sync/workflows/template/codspeed.template.yml
    dest: .github/workflows/codspeed.yml
    template:
      cache_key: venv-${{ hashFiles(env.CACHE_FILE) }}
      python_version: '3.12'
      token: ${{ secrets.CODSPEED_TOKEN }}
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: ''
      # This repository still uses Poetry and has no uv.lock. The hooks have
      # isolated environments, so syncing the project itself is unnecessary.
      sync_project_dependencies: 'false'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.12'
      source_dir: home_assistant_config_validator
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/led-matrix-controller:
  # PyAudio requires system PortAudio headers, so Prek skips the project's
  # dependency installation while continuing to use the shared workflow.
  - source: gha_sync/workflows/template/codspeed.template.yml
    dest: .github/workflows/codspeed.yml
    template:
      cache_key: venv-${{ hashFiles(env.CACHE_FILE) }}
      python_version: '3.11'
      token: ${{ secrets.CODSPEED_TOKEN }}
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.11'
      sync_project_dependencies: 'false'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.11'
      source_dir: led_matrix_controller
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.11'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/pre-commit-hooks-dependency-sync:
  # Naming note: this repo's OWN identity keeps "pre-commit" in its name and
  # hook id since other repos still reference it by that exact name - only
  # its internal CI tooling uses prek naming.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.13'
      sync_project_dependencies: 'true'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.13'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/wg-scripts:
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.14'
      sync_project_dependencies: 'true'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.14'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/wg-utilities:
  # PyPI and documentation publishing consume the published release event.
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: '3.12'
      sync_project_dependencies: 'true'
  - source: gha_sync/workflows/template/unit-tests.template.yml
    dest: .github/workflows/unit-tests.yml
    template:
      concurrency_group: unit-tests-${{ github.ref }}
      python_version: '3.12'
      source_dir: wg_utilities
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/smart-mini-crt-interface:
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

worganisation/very-slow-movie-player:
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.12'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
worganisation/dockarr:
  # Container builds/deployment are bespoke. Do not sync unit tests or auto-merge.
  - .github/actionlint.yaml
  - .github/CODEOWNERS
  - .github/labeler.yml
  - .github/repo_labels.yml
  - source: gha_sync/workflows/all/auto-create-pr.yml
    dest: .github/workflows/auto-create-pr.yml
    deleteOrphaned: true
  - source: gha_sync/workflows/all/manage-pr.yml
    dest: .github/workflows/manage-pr.yml
    deleteOrphaned: true
  - source: gha_sync/workflows/all/manage-repo-labels.yml
    dest: .github/workflows/manage-repo-labels.yml
    deleteOrphaned: true
  - source: gha_sync/workflows/all/prek-autoupdate.yml
    dest: .github/workflows/prek-autoupdate.yml
    deleteOrphaned: true
  - source: gha_sync/workflows/template/prek-hooks.template.yml
    dest: .github/workflows/prek-hooks.yml
    template:
      concurrency_group: prek-hooks-${{ github.ref }}
      python_version: ''
      sync_project_dependencies: 'false'
  - source: gha_sync/workflows/template/semantic-release.template.yml
    dest: .github/workflows/semantic-release.yml
    template:
      python_version: '3.11'
      force_deployment_expr: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
